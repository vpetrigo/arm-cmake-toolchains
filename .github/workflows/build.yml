name: 'Example projects build'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 10 * * 1'

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gcc: [ '13.3.rel1', '14.3.rel1', '15.3.rel2' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install official Arm GNU Toolchain - ${{ matrix.gcc }}
        uses: ./.github/actions/setup-arm-gcc
        with:
          release: ${{ matrix.gcc }}
      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build EFM32 LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/efm32/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/arm-gcc-toolchain.cmake
          cmake --build build/
          popd
      - name: Build K64F LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/nxp/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/arm-gcc-toolchain.cmake
          cmake --build build/
  build_linux_clang:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        clang: [ '22', '23' ]
        gcc: [ '13.3.rel1', '14.3.rel1', '15.3.rel2' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install official Arm GNU Toolchain - ${{ matrix.gcc }}
        uses: ./.github/actions/setup-arm-gcc
        with:
          release: ${{ matrix.gcc }}
      - name: Install LLVM and Clang - ${{ matrix.clang }}
        uses: egor-tensin/setup-clang@v2
        with:
          version: ${{ matrix.clang }}
      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build EFM32 LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/efm32/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/clang-arm-gcc-toolchain.cmake
          cmake --build build/
          popd
      - name: Build K64F LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/nxp/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/clang-arm-gcc-toolchain.cmake
          cmake --build build/
  build_win:
    runs-on: windows-latest
    strategy:
      matrix:
        gcc: [ '13.3.rel1', '14.3.rel1', '15.3.rel2' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install official Arm GNU Toolchain - ${{ matrix.gcc }}
        uses: ./.github/actions/setup-arm-gcc
        with:
          release: ${{ matrix.gcc }}
      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build EFM32 LED project
        run: |
          set PROJECT_ROOT=%CD%
          cd examples/efm32/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=%PROJECT_ROOT%\arm-gcc-toolchain.cmake
          cmake --build build/
          cd %PROJECT_ROOT%
        shell: cmd
      - name: Build K64F LED project
        run: |
          set PROJECT_ROOT=%CD%
          cd examples/nxp/led
          cmake -S . -B build\ -G Ninja -DCMAKE_TOOLCHAIN_FILE=%PROJECT_ROOT%\arm-gcc-toolchain.cmake
          cmake --build build\
          cd %PROJECT_ROOT%
        shell: cmd
  build_macos:
    # Arm no longer publishes macOS x86_64 binaries for GCC 15.
    runs-on: macos-15
    strategy:
      matrix:
        clang: [ '15.0.7' ]
        gcc: [ '13.3.rel1', '14.3.rel1', '15.3.rel2' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install official Arm GNU Toolchain - ${{ matrix.gcc }}
        uses: ./.github/actions/setup-arm-gcc
        with:
          release: ${{ matrix.gcc }}
      - name: Install LLVM and Clang - ${{ matrix.clang }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ matrix.clang }}
      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build EFM32 LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/efm32/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/clang-arm-gcc-toolchain.cmake
          cmake --build build/
          popd
      - name: Build K64F LED project
        run: |
          export PROJECT_ROOT="$(readlink -f .)"
          pushd examples/nxp/led
          cmake -S . -B build/ -G Ninja -DCMAKE_TOOLCHAIN_FILE=${PROJECT_ROOT}/clang-arm-gcc-toolchain.cmake
          cmake --build build/
